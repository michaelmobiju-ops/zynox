name = "zynox"
main = "src/index.js"
compatibility_date = "2026-11-25"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[vars]
APP_NAME = "ZYNOX"
APP_ENV = "production"

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "zynox-db"
database_id = "4459b94d-2dc3-4ae6-8a2a-1d48c25097a0"
