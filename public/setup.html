<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>ZYNOX — Configuração inicial</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap');

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #fff;
      font-family: 'Outfit', sans-serif;
      background: radial-gradient(
        ellipse at top,
        #24113F,
        #08080B 65%
      );
    }

    main {
      width: 100%;
      max-width: 420px;
      padding: 32px;
      background: #15121F;
      border: 1px solid #332448;
      border-radius: 24px;
      box-shadow: 0 20px 80px #0008;
    }

    .logo {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 42px;
      font-weight: 700;
      letter-spacing: -3px;
      color: #C084FC;
      margin-bottom: 32px;
    }

    h1 {
      font-size: 26px;
      margin-bottom: 8px;
    }

    p {
      color: #A19BAD;
      line-height: 1.6;
      font-size: 14px;
    }

    label {
      display: block;
      margin: 20px 0 8px;
      font-size: 13px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 15px;
      background: #08080B;
      border: 1px solid #332448;
      border-radius: 12px;
      color: white;
      font: inherit;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #C084FC;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(
        135deg,
        #7135FF,
        #9254FF
      );
      color: white;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
    }

    #message {
      margin-top: 16px;
      overflow-wrap: anywhere;
    }

    a {
      display: block;
      margin-top: 20px;
      color: #C084FC;
      text-align: center;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <main>
    <div class="logo">ZYNOX</div>

    <h1>Criar conta de DONO</h1>

    <p>
      Configuração inicial de acesso
      ao painel administrativo.
    </p>

    <form id="setup-form">

      <label for="username">
        Nome de usuário
      </label>

      <input
        id="username"
        type="text"
        autocomplete="username"
        autocapitalize="none"
        spellcheck="false"
        minlength="3"
        maxlength="40"
        required
      >

      <label for="password">
        Senha
      </label>

      <input
        id="password"
        type="password"
        autocomplete="current-password"
        minlength="12"
        maxlength="128"
        required
      >

      <button id="submit" type="submit">
        Criar minha conta
      </button>

      <p id="message" role="status"></p>

    </form>

    <a href="/">Voltar ao início</a>
  </main>

  <script>
    const form = document.getElementById("setup-form");
    const button = document.getElementById("submit");
    const message = document.getElementById("message");

    form.addEventListener("submit", async event => {
      event.preventDefault();

      if (button.disabled) return;

      button.disabled = true;
      button.textContent = "Criando conta...";

      message.style.color = "#C084FC";
      message.textContent = "Validando credenciais...";

      const username = document
        .getElementById("username")
        .value.trim().toLowerCase();

      const password = document
        .getElementById("password").value;

      let created = false;

      try {
        const response = await fetch(
          "/api/setup/owner",
          {
            method: "POST",
            credentials: "same-origin",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              username,
              password
            })
          }
        );

        const data = await response.json();

        if (!response.ok || !data.success) {
          throw new Error(
            data.error || "Falha ao criar conta."
          );
        }

        created = true;

        message.style.color = "#4ADE80";
        message.textContent =
          "Conta de DONO criada com sucesso!";

        form.reset();

        button.textContent = "Conta criada";

        setTimeout(() => {
          window.location.replace("/");
        }, 2000);

      } catch (error) {
        message.style.color = "#FF667D";
        message.textContent = error.message;

      } finally {
        document.getElementById("password").value = "";

        if (!created) {
          button.disabled = false;
          button.textContent = "Criar minha conta";
        }
      }
    });
  </script>

</body>
</html>
